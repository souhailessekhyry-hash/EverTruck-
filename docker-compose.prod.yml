services:
  mysql:
    image: mysql:8.0
    container_name: evertruck-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuperSecureRootPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-evertruck_production_db}
      MYSQL_USER: ${MYSQL_USER:-evertruck_prod}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-SuperSecureProdPassword2026!}
    volumes:
      - mysql_prod_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - evertruck-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-SuperSecureRootPassword2026!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: evertruck-redis-prod
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-secure_redis_pass}
    volumes:
      - redis_prod_data:/data
    networks:
      - evertruck-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: evertruck-backend-prod
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-evertruck_prod}:${MYSQL_PASSWORD:-SuperSecureProdPassword2026!}@mysql:3306/${MYSQL_DATABASE:-evertruck_production_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_pass}@redis:6379
      PORT: 4000
    networks:
      - evertruck-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:4000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    container_name: evertruck-frontend-prod
    restart: always
    env_file:
      - ./frontend/.env.production
    environment:
      NODE_ENV: production
      VITE_API_URL: /api
      PORT: 3000
    networks:
      - evertruck-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    container_name: evertruck-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - evertruck-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  evertruck-network:
    name: evertruck-network-prod
    driver: bridge

volumes:
  mysql_prod_data:
    name: evertruck-mysql-prod-data
  redis_prod_data:
    name: evertruck-redis-prod-data
