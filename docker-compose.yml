services:
  mysql:
    image: mysql:8.0
    container_name: evertruck-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-securepassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-evertruck_db}
      MYSQL_USER: ${MYSQL_USER:-evertruck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-securepassword123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - evertruck-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-securepassword123}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: evertruck-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - evertruck-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: evertruck-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-evertruck}:${MYSQL_PASSWORD:-securepassword123}@mysql:3306/${MYSQL_DATABASE:-evertruck_db}
      REDIS_URL: redis://redis:6379
      PORT: 4000
    networks:
      - evertruck-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:4000/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: evertruck-frontend
    restart: always
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_URL: /api
      PORT: 3000
    networks:
      - evertruck-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: evertruck-nginx
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
      - "${SSL_PORT:-8443}:443"
    networks:
      - evertruck-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  evertruck-network:
    name: evertruck-network
    driver: bridge

volumes:
  mysql_data:
    name: evertruck-mysql-data
  redis_data:
    name: evertruck-redis-data
